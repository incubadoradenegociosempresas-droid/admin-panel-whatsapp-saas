<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel WhatsApp SaaS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { background: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; }
    .header h1 { color: #667eea; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .card { background: white; padding: 30px; border-radius: 10px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    button { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f8f9fa; padding: 12px; text-align: left; font-weight: bold; border-bottom: 2px solid #ddd; }
    td { padding: 12px; border-bottom: 1px solid #ddd; }
    .status { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .active { background: #d4edda; color: #155724; }
    .message { padding: 12px; border-radius: 6px; margin-bottom: 20px; }
    .success { background: #d4edda; color: #155724; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 Panel Admin WhatsApp SaaS</h1>
      <p>Gestión de clientes y números WhatsApp</p>
    </div>
    
    <div class="grid">
      <div class="card">
        <h2>Nuevo Cliente</h2>
        <form id="clientForm">
          <div class="form-group">
            <label>Nombre del Negocio</label>
            <input type="text" required>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" required>
          </div>
          <div class="form-group">
            <label>Descripción</label>
            <textarea rows="4"></textarea>
          </div>
          <div class="form-group">
            <label>Teléfono del Dueño</label>
            <input type="tel">
          </div>
          <button type="submit">Crear Cliente</button>
        </form>
      </div>
      
      <div class="card">
        <h2>Clientes Activos</h2>
        <div class="message success">✓ Panel listo en producción</div>
        <table>
          <thead>
            <tr>
              <th>Negocio</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Ejemplo SA</td>
              <td><span class="status active">Activo</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
